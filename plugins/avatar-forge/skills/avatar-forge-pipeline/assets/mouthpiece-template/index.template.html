<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @font-face { font-family: "IBM Plex Sans SC"; src: local("IBM Plex Sans SC"); }
    @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"); }
    @font-face { font-family: "IBM Plex Mono"; src: local("IBM Plex Mono"); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #f3f7fa; }
    body { color: #101c2b; font-family: "IBM Plex Sans SC", "Microsoft YaHei", sans-serif; }
    #root { position: relative; overflow: hidden; background: #f3f7fa; }
    .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(7,111,216,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(7,111,216,.055) 1px,transparent 1px); background-size: 72px 72px; }
    .wash { position: absolute; width: 900px; height: 900px; right: -270px; top: -220px; border-radius: 50%; background: radial-gradient(circle,rgba(7,111,216,.16),rgba(7,111,216,0) 70%); }
    .rail { position: absolute; left: 64px; top: 72px; width: 3px; height: 520px; background: #076fd8; transform-origin: top; }
    .label { position: absolute; left: 92px; top: 72px; display: flex; gap: 16px; align-items: center; color: #4d6074; font: 600 21px/1 "IBM Plex Mono", monospace; letter-spacing: .12em; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #7257e8; box-shadow: 0 0 0 8px rgba(114,87,232,.12); }
    h1 { position: absolute; left: 92px; top: 145px; width: 520px; font-size: 72px; line-height: 1.04; font-weight: 700; letter-spacing: -.045em; }
    h1 em { display: block; color: #076fd8; font-style: normal; }
    .speaker-shell { position: absolute; right: 54px; top: 150px; width: 520px; height: 760px; overflow: hidden; border-radius: 260px 260px 44px 44px; background: #e9f1f7; border: 2px solid rgba(7,111,216,.3); box-shadow: 0 30px 70px rgba(16,28,43,.16); }
    .speaker-shell video { width: 100%; height: 100%; object-fit: cover; }
    .orbit { position: absolute; right: 22px; top: 118px; width: 584px; height: 824px; border: 1px dashed rgba(114,87,232,.35); border-radius: 292px 292px 70px 70px; }
    .statement { position: absolute; left: 92px; top: 720px; width: 360px; color: #4d6074; font-size: 28px; line-height: 1.55; font-weight: 300; }
    .caption-stage { position: absolute; left: 64px; right: 64px; top: 1080px; height: 520px; border-top: 2px solid #101c2b; padding-top: 42px; }
    .caption-kicker { color: #076fd8; font: 600 20px/1 "IBM Plex Mono", monospace; letter-spacing: .13em; }
    .caption { position: absolute; left: 0; right: 0; top: 102px; color: #101c2b; font-size: 64px; line-height: 1.28; font-weight: 700; letter-spacing: -.035em; opacity: 0; }
    .progress { position: absolute; left: 64px; right: 64px; bottom: 112px; height: 5px; background: rgba(7,111,216,.13); }
    .progress span { display: block; width: 100%; height: 100%; background: #076fd8; transform-origin: left; }
    footer { position: absolute; left: 64px; right: 64px; bottom: 62px; display: flex; justify-content: space-between; color: #4d6074; font: 400 18px/1 "IBM Plex Mono", monospace; letter-spacing: .06em; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="__DURATION__" data-width="1080" data-height="1920">
    <div class="grid" data-layout-ignore></div><div class="wash" data-layout-ignore></div><div class="rail"></div>
    <div class="label"><span class="dot"></span><span>AVATAR FORGE / LIVE</span></div>
    <h1>__TITLE__<em>DIGITAL PRESENCE</em></h1>
    <div class="orbit" data-layout-ignore></div>
    <div class="speaker-shell"><video id="avatar-video" class="clip" src="avatar.mp4" muted playsinline data-start="0" data-duration="__DURATION__" data-track-index="0"></video></div>
    <audio id="avatar-audio" class="clip" src="avatar.mp4" data-start="0" data-duration="__DURATION__" data-track-index="2" data-volume="1"></audio>
    <p class="statement">From one portrait and one voice, create a complete on-screen presence.</p>
    <section class="caption-stage"><div class="caption-kicker">VOICE TRANSCRIPT / LIVE</div>__CAPTION_HTML__</section>
    <div class="progress"><span></span></div><footer><span>LYCHEE AI LAB</span><span>__DURATION_LABEL__ SEC</span></footer>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const duration = __DURATION__;
    const captions = __CAPTION_DATA__;
    const tl = gsap.timeline({ paused: true });
    tl.from('.rail',{scaleY:0,duration:.58,ease:'expo.out'},.15)
      .from('.label',{x:-32,opacity:0,duration:.38,ease:'power3.out'},.22)
      .from('h1',{y:46,opacity:0,duration:.68,ease:'back.out(1.2)'},.28)
      .from('.speaker-shell',{x:58,opacity:0,scale:.97,duration:.78,ease:'power4.out'},.18)
      .from('.orbit',{scale:.82,opacity:0,duration:.64,ease:'circ.out'},.36)
      .from('.statement',{y:28,opacity:0,duration:.48,ease:'sine.out'},.62)
      .from('.caption-stage',{y:34,opacity:0,duration:.54,ease:'power2.out'},.74)
      .from('footer',{opacity:0,y:18,duration:.42,ease:'sine.out'},.9)
      .to('.orbit',{rotation:24,duration:Math.max(1,duration-.8),ease:'none'},.8)
      .fromTo('.progress span',{scaleX:0},{scaleX:1,duration:duration,ease:'none'},0);
    captions.forEach((caption,index) => {
      const selector = `#caption-${index}`;
      tl.fromTo(selector,{y:32,opacity:0,scale:.985},{y:0,opacity:1,scale:1,duration:.34,ease:index%2?'expo.out':'power3.out'},caption.start);
      tl.to(selector,{opacity:0,y:-16,duration:.2,ease:'power2.in'},Math.max(caption.start+.4,caption.end-.2));
    });
    tl.to(['h1','.statement','.caption-stage','.speaker-shell','.label','footer'],{opacity:0,y:-16,duration:.5,ease:'power2.in'},Math.max(.5,duration-.55));
    window.__timelines.main = tl;
  </script>
</body>
</html>
